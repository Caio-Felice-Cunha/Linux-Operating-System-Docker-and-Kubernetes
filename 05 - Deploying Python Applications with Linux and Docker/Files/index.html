<!DOCTYPE html>
<html>
<body>

<h2>MyPythonApp</h2>

<div id="AppPython"></div>

<script>

 // squad is rendered by Flask's |tojson filter, so it is already a real JS object.
 var squad = {{ squad|tojson }};

 var lines = [];
 lines.push("<p><strong>" + squad.squadName + "</strong> from " + squad.homeTown + " (formed " + squad.formed + ")</p>");
 lines.push("<ul>");
 squad.members.forEach(function (member) {
   lines.push("<li>" + member.name + " - " + member.secretIdentity + " (age " + member.age + ")</li>");
 });
 lines.push("</ul>");

 document.getElementById("AppPython").innerHTML = lines.join("");

</script>

</body>
</html>
