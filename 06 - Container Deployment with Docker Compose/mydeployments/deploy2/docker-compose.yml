version: '3'


services:

  my_database:
    container_name: my_database
    hostname: my_database
    image: postgres
    volumes:
      # The postgres image declares VOLUME /var/lib/postgresql/data, so the bind
      # mount must target that exact path for ./volume to actually persist data.
      - ./volume:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - 54321:5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5


  my_api:
    container_name: my_api
    hostname: my_api
    build:
      context: ./my_api
      dockerfile: Dockerfile
    ports:
     - 54322:5000
    volumes:
      - ./my_api/src/:/usr/src/app/
      - /usr/src/app/node_modules
    restart: unless-stopped
    environment:
      NODE_ENV: ${MY_ENVIRONMENT}
    depends_on:
      - my_database


  my_webserver:
      container_name: my_webserver
      hostname: my_webserver
      build:
          context: ./my_webserver
          dockerfile: Dockerfile
      ports:
        - 80:80
      volumes:
        - ./my_webserver/src/test:/usr/share/nginx/html
      restart: always
      depends_on:
        - my_api

        