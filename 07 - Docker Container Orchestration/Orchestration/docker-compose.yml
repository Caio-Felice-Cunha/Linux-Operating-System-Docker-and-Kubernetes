version: "3.9"

services:

  web:
    build:
      context: .
      dockerfile: Dockerfile.app
    image: orchestration-web:v1

  # Named "mydb" so the in-container hostname matches app.py's
  # redis.Redis(host='mydb', ...). This mirrors the Swarm flow, which creates
  # the Redis service with `docker service create --name mydb ...`.
  mydb:
    build:
      context: .
      dockerfile: Dockerfile.db

  web2:
    build:
      context: .
      dockerfile: Dockerfile.app
    volumes:
      - .:/code
    image: orchestration-web:v2
